services:
  # Unified Frontend + Backend Service
  - type: web
    name: somnia-gas-profiler
    env: node
    plan: starter
    buildCommand: cd api && npm install && cd frontend && npm install && npm run build && cd ..
    startCommand: cd api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: REDIS_URL
        fromService:
          type: redis
          name: somnia-gas-profiler-redis
          property: connectionString
      - key: PRIVATE_KEY
        sync: false
      - key: RPC_URL
        value: https://dream-rpc.somnia.network
      # AI Integration Configuration
      - key: AI_ENABLED
        value: true
      - key: AI_PROVIDER
        value: iointelligence
      - key: AI_MODEL
        value: gpt-4
      - key: IOINTELLIGENCE_API_KEY
        sync: false  # Set this in Render dashboard for security
      - key: OPENAI_API_KEY
        sync: false  # Optional fallback provider
      - key: ANTHROPIC_API_KEY
        sync: false  # Optional fallback provider
      # Analysis Configuration
      - key: ANALYSIS_TIMEOUT
        value: 30000
      - key: CACHE_TTL
        value: 3600
      - key: MAX_CONCURRENT_ANALYSES
        value: 5
      - key: AI_TIMEOUT
        value: 30000
      - key: AI_RETRY_ATTEMPTS
        value: 3
      - key: AI_FALLBACK_ENABLED
        value: true
    healthCheckPath: /api/health

  # Redis Database
  - type: redis
    name: somnia-gas-profiler-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      # Allow all Render services in this environment to connect
      - source: 0.0.0.0/0
        description: Allow all (development/test)
